<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mango — Cotizador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23191919'/><text x='6' y='24' font-size='22' fill='%23FFCE00' font-family='sans-serif' font-style='italic' font-weight='700'>M</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F9F9F9; font-family: 'Open Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    input[type="range"] { -webkit-appearance: none; appearance: none; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: #FFCE00; cursor: pointer; border: 2px solid #191919; margin-top: -7px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%;
      background: #FFCE00; cursor: pointer; border: 2px solid #191919;
    }
    .pdf-section { page-break-inside: avoid; break-inside: avoid; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const T = {
      primary: "#FFCE00", primaryHover: "#FFE166", primaryLight: "#FFF8D6",
      dark: "#191919", surface: "#FFFFFF", bg: "#F9F9F9",
      text: "#000000", textSecondary: "#666666", textMuted: "#999999",
      border: "#E6E6E6", borderInput: "#CCCCCC",
      green: "#2CC87B", greenLight: "rgba(44,200,123,0.12)",
      orange: "#FF6B35", orangeLight: "rgba(255,107,53,0.12)",
      red: "#B71414", redBg: "#FBE3E3",
      blue: "#3B82F6", blueLight: "rgba(59,130,246,0.1)",
      purple: "#7C4DFF", purpleLight: "rgba(124,77,255,0.1)",
      radiusCard: 16, radiusButton: 8, radiusBadge: 80,
    };

    const seatTiers = {
      basico: {
        id: "basico", label: "Basico", role: "Operativos", price: 1200,
        color: T.textSecondary, colorBg: "#F5F5F5",
        features: ["Dashboard de conciliacion", "Vista de facturas y pagos", "Registro manual de pagos", "Exportacion Excel", "Conciliacion asistida (confirmar match)"],
        almaAccess: "Sin ALMA",
      },
      pro: {
        id: "pro", label: "Pro", role: "Gerencia", price: 2500,
        color: T.blue, colorBg: T.blueLight,
        features: ["Todo lo de Basico", "Reportes de aging y concentracion", "Alertas de deterioro de cartera", "Vista multi-sucursal (sus sucursales)", "ALMA chat (creditos compartidos)", "Ghost Extension (capturas)", "Conciliacion inteligente completa"],
        almaAccess: "ALMA Chat",
      },
      business: {
        id: "business", label: "Business", role: "Direccion", price: 4500,
        color: T.primary, colorBg: T.primaryLight,
        features: ["Todo lo de Pro", "Dashboard ejecutivo global", "Vista consolidada todas las sucursales", "Analisis predictivo y tendencias", "ALMA sin limite de creditos", "Ghost Extension + screen recording", "Reportes programados (lunes/viernes)", "API access (webhooks de senales)", "Exportacion avanzada + BI connect"],
        almaAccess: "ALMA Ilimitado",
      },
    };

    const txnTiers = [
      { min: 0, max: 300, price: 12 },
      { min: 301, max: 700, price: 10 },
      { min: 701, max: 1500, price: 8.50 },
      { min: 1501, max: 3000, price: 7 },
      { min: 3001, max: 5000, price: 6 },
      { min: 5001, max: 99999, price: 6 },
    ];

    const almaPacks = [
      { id: "starter", queries: 200, price: 2000, label: "Starter",
        examples: [
          "\"¿Cuanto me debe Constructora Perez?\"",
          "\"¿Que facturas vencen esta semana?\"",
          "\"Dame el resumen del dia\"",
        ],
        desc: "Consultas basicas de cartera y estatus de pagos",
      },
      { id: "profesional", queries: 600, price: 5000, label: "Profesional",
        examples: [
          "Todo lo de Starter, mas:",
          "\"¿Cuales clientes tienen mas de 30 dias sin pagar?\"",
          "\"Comparame la cobranza de enero vs febrero\"",
          "\"¿Quien es mi cliente con mayor riesgo?\"",
          "\"Genera un reporte de aging por sucursal\"",
        ],
        desc: "Analisis de tendencias, comparativos y alertas proactivas",
      },
      { id: "business", queries: 1500, price: 10000, label: "Business",
        examples: [
          "Todo lo de Profesional, mas:",
          "\"Proyecta mi flujo de cobros para los proximos 3 meses\"",
          "\"¿Que clientes deberia dejar de surtir?\"",
          "\"Analiza el patron de pago de Grupo Constructor Norte\"",
          "\"Dame insights para mi junta de directores\"",
          "\"Conecta con mi BI via API y manda reportes los lunes\"",
        ],
        desc: "Predicciones, recomendaciones estrategicas, API y reportes automaticos",
      },
    ];

    const proteccionTiers = [
      { min: 0, max: 5, rate: 2.0, label: "0-5M" },
      { min: 5, max: 10, rate: 1.9, label: "5-10M" },
      { min: 10, max: 20, rate: 1.8, label: "10-20M" },
      { min: 20, max: 35, rate: 1.7, label: "20-35M" },
      { min: 35, max: 50, rate: 1.6, label: "35-50M" },
      { min: 50, max: 9999, rate: 1.5, label: "50M+" },
    ];

    function getProteccionRate(montoMillones) {
      const t = proteccionTiers.find(t => montoMillones >= t.min && montoMillones < t.max);
      return t || proteccionTiers[proteccionTiers.length - 1];
    }

    function getTxnPrice(vol) {
      const t = txnTiers.find(t => vol >= t.min && vol <= t.max);
      return t ? t.price : 6;
    }
    function fmt(n) { return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n); }
    function fmtPct(n) { return `${n.toFixed(1)}%`; }

    // --- Components ---
    function Slider({ label, value, onChange, min, max, step = 1, suffix = "", formatVal }) {
      const pct = ((value - min) / (max - min)) * 100;
      return (
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ color: T.textSecondary, fontSize: 13, fontWeight: 500 }}>{label}</span>
            <span style={{ color: T.dark, fontSize: 14, fontWeight: 700 }}>{formatVal ? formatVal(value) : value}{suffix}</span>
          </div>
          <input type="range" min={min} max={max} step={step} value={value}
            onChange={e => onChange(Number(e.target.value))}
            style={{ width: "100%", height: 6, appearance: "none",
              background: `linear-gradient(to right, ${T.primary} 0%, ${T.primary} ${pct}%, ${T.border} ${pct}%, ${T.border} 100%)`,
              borderRadius: 3, outline: "none", cursor: "pointer" }} />
        </div>
      );
    }

    function Card({ children, style = {} }) {
      return <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: T.radiusCard, padding: 24, marginBottom: 16, ...style }}>{children}</div>;
    }

    function SectionTitle({ children, style = {} }) {
      return <div style={{ fontSize: 11, fontWeight: 700, color: T.textMuted, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 14, ...style }}>{children}</div>;
    }

    function Badge({ children, color, bg }) {
      return <span style={{ display: "inline-block", padding: "3px 12px", borderRadius: T.radiusBadge, fontSize: 11, fontWeight: 700, background: bg, color }}>{children}</span>;
    }

    function Toggle({ enabled, onChange, color = T.green }) {
      return (
        <div onClick={() => onChange(!enabled)} style={{ width: 36, height: 20, borderRadius: 10, background: enabled ? color : T.border, position: "relative", transition: "all 0.2s", cursor: "pointer", flexShrink: 0 }}>
          <div style={{ width: 16, height: 16, borderRadius: 8, background: "white", position: "absolute", top: 2, left: enabled ? 18 : 2, transition: "all 0.2s" }} />
        </div>
      );
    }

    // Lucide-style inline SVG icons (16x16)
    const Icons = {
      shield: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
      receipt: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>,
      monitor: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>,
      sparkles: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
      handshake: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>,
    };

    // Product brief — portal FindingBadge pattern
    function ProductBrief({ icon, color, colorBg, problem, solution, benefits }) {
      return (
        <div style={{ padding: "14px 16px", background: `${colorBg}`, border: `1px solid ${color}15`, borderRadius: 10, marginBottom: 16 }}>
          <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
            <div style={{ width: 32, height: 32, borderRadius: 8, background: `${color}18`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color }}>
              {icon}
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: T.dark, marginBottom: 4 }}>{problem}</div>
              <div style={{ fontSize: 11, color: T.textSecondary, lineHeight: 1.5, marginBottom: 8 }}>{solution}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                {benefits.map((b, i) => (
                  <span key={i} style={{ fontSize: 10, padding: "2px 8px", borderRadius: 80, background: `${color}12`, color, fontWeight: 600 }}>{b}</span>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Product card wrapper — greyed out + collapsed when off
    function ProductCard({ title, badge, badgeColor, badgeBg, enabled, onChange, toggleColor, accentBorder, children }) {
      const borderStyle = enabled && accentBorder
        ? { border: `2px solid ${accentBorder}`, boxShadow: `0 0 0 1px ${accentBorder}22` }
        : {};
      return (
        <Card style={{ opacity: enabled ? 1 : 0.5, transition: "all 0.25s", ...borderStyle }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: enabled ? 14 : 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <SectionTitle style={{ marginBottom: 0 }}>{title}</SectionTitle>
              {badge && <Badge color={badgeColor || T.dark} bg={badgeBg || T.border}>{badge}</Badge>}
            </div>
            <Toggle enabled={enabled} onChange={onChange} color={toggleColor || T.green} />
          </div>
          {enabled && children}
        </Card>
      );
    }

    function SeatCounter({ tier, count, onChange }) {
      const info = seatTiers[tier];
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", background: count > 0 ? info.colorBg : T.bg, border: `1px solid ${count > 0 ? info.color + "44" : T.border}`, borderRadius: T.radiusButton, marginBottom: 8, transition: "all 0.2s" }}>
          <div style={{ flex: 1 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 14, fontWeight: 700, color: T.text }}>{info.label}</span>
              <Badge color={info.color === T.textSecondary ? T.textSecondary : info.color} bg={info.colorBg}>{info.role}</Badge>
            </div>
            <div style={{ fontSize: 12, color: T.textMuted, marginTop: 2 }}>{fmt(info.price)}/usuario/mes · {info.almaAccess}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button onClick={() => onChange(Math.max(0, count - 1))} style={{ width: 28, height: 28, borderRadius: 6, border: `1px solid ${T.border}`, background: T.surface, cursor: "pointer", fontSize: 16, fontWeight: 700, color: T.textSecondary, display: "flex", alignItems: "center", justifyContent: "center" }}>-</button>
            <span style={{ width: 32, textAlign: "center", fontSize: 16, fontWeight: 800, color: T.dark }}>{count}</span>
            <button onClick={() => onChange(count + 1)} style={{ width: 28, height: 28, borderRadius: 6, border: `1px solid ${T.primary}`, background: T.primaryLight, cursor: "pointer", fontSize: 16, fontWeight: 700, color: T.dark, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
          </div>
        </div>
      );
    }

    function BreakdownRow({ label, amount, pct, color, sub }) {
      return (
        <div style={{ padding: "8px 0", borderBottom: `1px solid ${T.border}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 8, height: 8, borderRadius: 2, background: color, flexShrink: 0 }} />
            <span style={{ color: T.text, fontSize: 13, flex: 1 }}>{label}</span>
            {pct > 0 && <span style={{ color: T.textMuted, fontSize: 12 }}>{fmtPct(pct)}</span>}
            <span style={{ color: T.text, fontSize: 13, fontWeight: 700, minWidth: 100, textAlign: "right" }}>{fmt(amount)}</span>
          </div>
          {sub && <div style={{ fontSize: 11, color: T.textMuted, marginLeft: 16, marginTop: 2 }}>{sub}</div>}
        </div>
      );
    }

    // --- Main App ---
    function PricingModel() {
      // Product toggles
      const [proteccionEnabled, setProteccionEnabled] = useState(true);
      const [conciliacionEnabled, setConciliacionEnabled] = useState(true);
      const [plataformaEnabled, setPlataformaEnabled] = useState(true);
      const [almaEnabled, setAlmaEnabled] = useState(true);
      const [cobranzaEnabled, setCobranzaEnabled] = useState(true);

      // Proteccion de Pagos
      const [proteccionFeeAnual, setProteccionFeeAnual] = useState(80000);
      const [proteccionMontoMensual, setProteccionMontoMensual] = useState(15);
      const [rateOverride, setRateOverride] = useState(null); // null = auto, number = manual
      const [showRateOverride, setShowRateOverride] = useState(false);

      // Perfil distribuidor (conciliacion)
      const [branches, setBranches] = useState(3);
      const [txns, setTxns] = useState(1400);
      const [avgTxnAmount, setAvgTxnAmount] = useState(85000);

      // Plataforma (seats)
      const [seatsBasico, setSeatsBasico] = useState(3);
      const [seatsPro, setSeatsPro] = useState(2);
      const [seatsBusiness, setSeatsBusiness] = useState(1);
      const [expandedTier, setExpandedTier] = useState(null);

      // ALMA
      const [almaPack, setAlmaPack] = useState("profesional");

      // Cobranza
      const [cobranzaFacturas, setCobranzaFacturas] = useState(20);
      const [cobranzaAvgAmount, setCobranzaAvgAmount] = useState(25000);
      const [cobranzaRate, setCobranzaRate] = useState(10);
      const [cobranzaRecovery, setCobranzaRecovery] = useState(70);

      // Comparison
      const [manualStaff, setManualStaff] = useState(4);
      const [avgSalary, setAvgSalary] = useState(17500);

      // Proyeccion
      const [growthRate, setGrowthRate] = useState(5);
      const [showProyeccion, setShowProyeccion] = useState(false);
      const [moraRate, setMoraRate] = useState(8); // % de venta que se pierde sin proteccion

      // Propuesta Comercial
      const [showPropuesta, setShowPropuesta] = useState(false);
      const [propuestaStep, setPropuestaStep] = useState("form");
      const [pdfPropuesta, setPdfPropuesta] = useState(true);
      const [pdfBrochure, setPdfBrochure] = useState(true);
      const [propuestaData, setPropuestaData] = useState({
        empresa: "",
        contacto: "",
        email: "",
        cargo: "",
        vigencia: 7,
      });

      const calc = useMemo(() => {
        // Seats — solo cobran si conciliacion esta activa
        const totalSeats = plataformaEnabled ? seatsBasico + seatsPro + seatsBusiness : 0;
        const seatsCobrables = plataformaEnabled && conciliacionEnabled;
        const basicoCost = seatsCobrables ? seatsBasico * seatTiers.basico.price : 0;
        const proCost = seatsCobrables ? seatsPro * seatTiers.pro.price : 0;
        const businessCost = seatsCobrables ? seatsBusiness * seatTiers.business.price : 0;
        const totalSeatsCost = basicoCost + proCost + businessCost;

        // Proteccion de Pagos
        const proteccionMontoReal = proteccionEnabled ? proteccionMontoMensual * 1000000 : 0;
        const proteccionTier = getProteccionRate(proteccionMontoMensual);
        const proteccionAutoRate = proteccionTier.rate;
        const proteccionRate = proteccionEnabled ? (rateOverride !== null ? rateOverride : proteccionAutoRate) : 0;
        const protectedTxns = proteccionEnabled ? Math.round(proteccionMontoReal / Math.max(avgTxnAmount, 1)) : 0;
        const proteccionComisionMensual = proteccionEnabled ? Math.round(proteccionMontoReal * proteccionRate / 100) : 0;

        // Conciliation
        const unprotectedTxns = conciliacionEnabled ? Math.max(0, txns - protectedTxns) : 0;
        const conciliationPrice = getTxnPrice(unprotectedTxns);
        const conciliationTotal = conciliacionEnabled ? unprotectedTxns * conciliationPrice : 0;

        // ALMA
        const almaPackInfo = almaPacks.find(p => p.id === almaPack);
        const almaCost = almaEnabled ? almaPackInfo.price : 0;

        // Cobranza
        const cobranzaRecovered = cobranzaFacturas * cobranzaAvgAmount * (cobranzaRecovery / 100);
        const cobranzaCost = cobranzaEnabled ? cobranzaRecovered * (cobranzaRate / 100) : 0;

        // Totals — mensual solo lo que se paga mes a mes
        const totalMensual = totalSeatsCost + proteccionComisionMensual + conciliationTotal + almaCost + cobranzaCost;
        const totalPagosAnuales = proteccionEnabled ? proteccionFeeAnual : 0;
        const totalAnual = totalMensual * 12 + totalPagosAnuales;

        // Comparison
        const manualCost = manualStaff * avgSalary;
        const mangoSaasCost = totalSeatsCost + conciliationTotal + almaCost;
        const savings = manualCost - mangoSaasCost;
        const savingsPct = manualCost > 0 ? (savings / manualCost) * 100 : 0;

        // Active product count
        const activeProducts = [proteccionEnabled, conciliacionEnabled, plataformaEnabled, almaEnabled, cobranzaEnabled].filter(Boolean).length;

        return {
          totalSeats, basicoCost, proCost, businessCost, totalSeatsCost,
          protectedTxns, unprotectedTxns, proteccionMontoReal, proteccionRate,
          proteccionComisionMensual,
          conciliationPrice, conciliationTotal,
          almaPackInfo, almaCost,
          cobranzaRecovered, cobranzaCost,
          totalMensual, totalPagosAnuales, totalAnual,
          manualCost, mangoSaasCost, savings, savingsPct,
          activeProducts,
        };
      }, [seatsBasico, seatsPro, seatsBusiness, txns, avgTxnAmount, branches, proteccionEnabled, proteccionFeeAnual, proteccionMontoMensual, rateOverride, conciliacionEnabled, plataformaEnabled, almaEnabled, almaPack, cobranzaEnabled, cobranzaFacturas, cobranzaAvgAmount, cobranzaRate, cobranzaRecovery, manualStaff, avgSalary]);

      return (
        <div style={{ minHeight: "100vh", background: T.bg }}>
          {/* Header */}
          <div style={{ background: T.dark, padding: "16px 32px", display: "flex", alignItems: "center", gap: 12, position: "sticky", top: 0, zIndex: 100, boxShadow: "0 2px 8px rgba(0,0,0,0.15)" }}>
            <div style={{ width: 36, height: 36, background: T.primary, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 20, color: T.dark, fontStyle: "italic" }}>M</div>
            <div>
              <div style={{ color: "#fff", fontSize: 16, fontWeight: 700 }}>Mango</div>
              <div style={{ color: T.textMuted, fontSize: 11 }}>Proteccion de Pagos · Cobros · Inteligencia · Cobranza</div>
            </div>
            <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
              <span style={{ color: T.textMuted, fontSize: 12 }}>{calc.activeProducts} productos activos</span>
              <Badge color={T.dark} bg={T.primary}>Cotizador a la medida</Badge>
            </div>
          </div>

          <div style={{ maxWidth: 1100, margin: "0 auto", padding: "24px 24px" }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>

              {/* LEFT — Product toggles */}
              <div>
                {/* 1. Proteccion de Pagos */}
                <ProductCard title="Proteccion de Pagos" badge="CORE" badgeColor={T.dark} badgeBg={T.primary} enabled={proteccionEnabled} onChange={setProteccionEnabled} toggleColor={T.primary} accentBorder={T.primary}>
                  <ProductBrief
                    icon={Icons.shield}
                    color={T.primary}
                    colorBg={T.primaryLight}
                    problem="¿Vendes a credito y no sabes si te van a pagar?"
                    solution="Mango garantiza el pago de tus ventas a constructores. Tu surtes con confianza y nosotros asumimos el riesgo. Si el constructor no paga, Mango te paga."
                    benefits={["Garantia de pago", "Vende sin riesgo", "Mango asume la perdida", "Cobra puntual siempre"]}
                  />
                  <Slider label="Monto total protegido mensual" value={proteccionMontoMensual} onChange={setProteccionMontoMensual} min={1} max={80} step={1} formatVal={v => `$${v}M MXN`} />
                  <div style={{ marginBottom: 20 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                      <span style={{ color: T.textSecondary, fontSize: 13, fontWeight: 500 }}>Fee de habilitacion</span>
                      <span style={{ color: T.dark, fontSize: 14, fontWeight: 700 }}>PAGO ANUAL</span>
                    </div>

                              <div style={{ fontSize: 11, color: T.textSecondary, marginTop: 3 }}>{propuestaData.empresa} · {fechaHoy}</div>
                            </div>
                            <img src="mango-isotipo.png" alt="Mango" style={{ width: 48, height: 48, objectFit: "contain", flexShrink: 0 }} />
                          </div>

                          <div style={{ borderTop: `1px solid ${T.border}`, marginBottom: 14 }} />

                          {/* Qué incluye tu plan — tarifas, no montos */}
                          <div style={{ fontSize: 13, fontWeight: 700, color: T.dark, marginBottom: 8 }}>¿Qué incluye tu plan?</div>
                          <div style={{ marginBottom: 16 }}>
                            {proteccionEnabled && (
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${T.border}` }}>
                                <div>
                                  <span style={{ fontSize: 12, fontWeight: 600, color: T.dark }}>Protección de Pagos</span>
                                  <span style={{ fontSize: 11, color: T.textSecondary, marginLeft: 8 }}>Mango garantiza el cobro de cada venta</span>
                                </div>
                                <span style={{ fontSize: 12, fontWeight: 700, color: T.dark, whiteSpace: "nowrap" }}>{calc.proteccionRate.toFixed(1)}% + IVA por transacción</span>
                              </div>
                            )}
                            {proteccionEnabled && calc.totalPagosAnuales > 0 && (
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${T.border}` }}>
                                <div>
                                  <span style={{ fontSize: 12, fontWeight: 600, color: T.primary }}>Fee de habilitación</span>
                                  <span style={{ fontSize: 11, color: T.textSecondary, marginLeft: 8 }}>Pago único anual</span>
                                </div>
                                <span style={{ fontSize: 12, fontWeight: 700, color: T.dark }}>{fmt(calc.totalPagosAnuales)} + IVA</span>
                              </div>
                            )}
                            {conciliacionEnabled && (
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${T.border}` }}>
                                <div>
                                  <span style={{ fontSize: 12, fontWeight: 600, color: T.dark }}>Conciliación Automática</span>
                                  <span style={{ fontSize: 11, color: T.textSecondary, marginLeft: 8 }}>Match pagos vs facturas SAT</span>
                                </div>
                                <span style={{ fontSize: 12, fontWeight: 700, color: T.dark, whiteSpace: "nowrap" }}>{fmt(calc.conciliationPrice)}/txn + IVA</span>
                              </div>
                            )}
                            {plataformaEnabled && conciliacionEnabled && (
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${T.border}` }}>
                                <div>
                                  <span style={{ fontSize: 12, fontWeight: 600, color: T.dark }}>Plataforma Digital</span>
                                  <span style={{ fontSize: 11, color: T.textSecondary, marginLeft: 8 }}>{calc.totalSeats} usuarios</span>
                                </div>
                                <span style={{ fontSize: 12, fontWeight: 700, color: T.dark }}>{fmt(calc.totalSeatsCost)}/mes + IVA</span>
                              </div>
                            )}
                            {almaEnabled && (
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${T.border}` }}>
                                <div>
                                  <span style={{ fontSize: 12, fontWeight: 600, color: T.dark }}>ALMA {calc.almaPackInfo.label}</span>
                                  <span style={{ fontSize: 11, color: T.textSecondary, marginLeft: 8 }}>{calc.almaPackInfo.queries} consultas/mes</span>
                                </div>
                                <span style={{ fontSize: 12, fontWeight: 700, color: T.dark }}>{fmt(calc.almaCost)}/mes + IVA</span>
                              </div>
                            )}
                            {cobranzaEnabled && (
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${T.border}` }}>
                                <div>
                                  <span style={{ fontSize: 12, fontWeight: 600, color: T.dark }}>Gestión de Cobranza</span>
                                  <span style={{ fontSize: 11, color: T.textSecondary, marginLeft: 8 }}>Solo pagas por resultados</span>
                                </div>
                                <span style={{ fontSize: 12, fontWeight: 700, color: T.dark }}>{cobranzaRate}% sobre recuperado + IVA</span>
                              </div>
                            )}
                          </div>

                          <div style={{ fontSize: 10, color: T.textMuted, fontStyle: "italic", marginBottom: 16 }}>Los costos variables dependen del volumen de operación. A continuación una simulación basada en tu volumen estimado.</div>

                          <div style={{ borderTop: `1px solid ${T.border}`, marginBottom: 14 }} />

                          {/* Proyección 12 meses */}
                          {(() => {
                            const bMonths = [];
                            for (let m = 1; m <= 12; m++) {
                              const g = Math.pow(1 + growthRate / 100, m - 1);
                              const vp = proteccionEnabled ? calc.proteccionMontoReal * g : 0;
                              const cr = cobranzaEnabled ? calc.cobranzaRecovered * g : 0;
                              const sv = calc.savings > 0 ? calc.savings : 0;
                              const val = vp + cr + sv;
                              const cost = calc.totalMensual + (m === 1 ? calc.totalPagosAnuales : 0);
                              bMonths.push({ vp, val, cost });
                            }
                            const totalInv = bMonths.reduce((s, m) => s + m.cost, 0);
                            const totalVal = bMonths.reduce((s, m) => s + m.val, 0);
                            const bRoi = totalInv > 0 ? ((totalVal - totalInv) / totalInv * 100) : 0;
                            const ventaAnual = bMonths.reduce((s, m) => s + m.vp, 0);
                            const perdidaMora = ventaAnual * (moraRate / 100);
                            const ventaPerdida = ventaAnual * 0.15;
                            const costoSinM = perdidaMora + ventaPerdida + (calc.manualCost * 12);

                            return (
                              <div>
                                <div style={{ fontSize: 13, fontWeight: 700, color: T.dark, marginBottom: 8 }}>Proyección a 12 meses ({growthRate}% crecimiento mensual)</div>

                                {/* KPI row */}
                                <div className="pdf-section" style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6, marginBottom: 14 }}>
                                  <div style={{ padding: "8px 6px", background: T.bg, borderRadius: 6, textAlign: "center" }}>
                                    <div style={{ fontSize: 8, color: T.textMuted, textTransform: "uppercase", fontWeight: 600 }}>Inversión 12m</div>
                                    <div style={{ fontSize: 13, fontWeight: 800, color: T.dark, marginTop: 2 }}>{fmt(totalInv)}</div>
                                  </div>
                                  <div style={{ padding: "8px 6px", background: T.greenLight, borderRadius: 6, textAlign: "center" }}>
                                    <div style={{ fontSize: 8, color: T.green, textTransform: "uppercase", fontWeight: 600 }}>Valor generado</div>
                                    <div style={{ fontSize: 13, fontWeight: 800, color: T.green, marginTop: 2 }}>{fmt(totalVal)}</div>
                                  </div>
                                  <div style={{ padding: "8px 6px", background: T.greenLight, borderRadius: 6, textAlign: "center" }}>
                                    <div style={{ fontSize: 8, color: T.green, textTransform: "uppercase", fontWeight: 600 }}>ROI</div>
                                    <div style={{ fontSize: 13, fontWeight: 800, color: T.green, marginTop: 2 }}>{Math.round(bRoi)}%</div>
                                  </div>
                                  <div style={{ padding: "8px 6px", background: T.greenLight, borderRadius: 6, textAlign: "center" }}>
                                    <div style={{ fontSize: 8, color: T.green, textTransform: "uppercase", fontWeight: 600 }}>Retorno</div>
                                    <div style={{ fontSize: 13, fontWeight: 800, color: T.green, marginTop: 2 }}>{bRoi > 0 ? `${Math.round(bRoi / 100)}:1` : "—"}</div>
                                  </div>
                                </div>

                                {/* Simple bar chart */}
                                <div style={{ display: "flex", gap: 3, alignItems: "flex-end", height: 80, marginBottom: 6 }}>
                                  {bMonths.map((m, i) => {
                                    const maxB = Math.max(...bMonths.map(x => Math.max(x.val, x.cost)));
                                    const hV = maxB > 0 ? (m.val / maxB) * 85 : 3;
                                    const hC = maxB > 0 ? (m.cost / maxB) * 85 : 2;
                                    return (
                                      <div key={i} style={{ flex: 1, display: "flex", gap: 1, alignItems: "flex-end", height: "100%" }}>
                                        <div style={{ width: "48%", height: Math.max(hV, 2), background: T.green, borderRadius: "2px 2px 0 0" }} />
                                        <div style={{ width: "48%", height: Math.max(hC, 2), background: T.border, borderRadius: "2px 2px 0 0" }} />
                                      </div>
                                    );
                                  })}
                                </div>
                                <div style={{ display: "flex", gap: 12, marginBottom: 24 }}>
                                  <span style={{ fontSize: 10, color: T.textMuted, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 8, height: 8, borderRadius: 2, background: T.green, display: "inline-block" }} /> Valor</span>
                                  <span style={{ fontSize: 10, color: T.textMuted, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 8, height: 8, borderRadius: 2, background: T.border, display: "inline-block" }} /> Costo</span>
                                </div>

                                {/* Comparativo Sin Mango vs Con Mango */}
                                <div className="pdf-section">
                                <div style={{ fontSize: 13, fontWeight: 700, color: T.dark, marginBottom: 8 }}>¿Cuánto cuesta NO tener Mango?</div>
                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
                                  <div style={{ padding: 12, background: T.redBg, borderRadius: 6, border: `1px solid ${T.red}22` }}>
                                    <div style={{ fontSize: 10, fontWeight: 700, color: T.red, textTransform: "uppercase", marginBottom: 8 }}>Sin Mango (12m)</div>
                                    <div style={{ fontSize: 11, color: T.textSecondary, marginBottom: 4 }}>Pérdida por mora ({moraRate}%): <strong style={{ color: T.red }}>{fmt(perdidaMora)}</strong></div>
                                    <div style={{ fontSize: 11, color: T.textSecondary, marginBottom: 4 }}>Venta no cerrada sin crédito: <strong style={{ color: T.red }}>{fmt(ventaPerdida)}</strong></div>
                                    <div style={{ fontSize: 11, color: T.textSecondary, marginBottom: 8 }}>Conciliación manual: <strong>{fmt(calc.manualCost * 12)}</strong></div>
                                    <div style={{ borderTop: `1px solid ${T.red}44`, paddingTop: 6 }}>
                                      <span style={{ fontSize: 13, fontWeight: 800, color: T.red }}>Total: {fmt(costoSinM)}</span>
                                    </div>
                                  </div>
                                  <div style={{ padding: 12, background: T.greenLight, borderRadius: 6, border: `1px solid ${T.green}33` }}>
                                    <div style={{ fontSize: 10, fontWeight: 700, color: T.green, textTransform: "uppercase", marginBottom: 8 }}>Con Mango (12m)</div>
                                    <div style={{ fontSize: 11, color: T.textSecondary, marginBottom: 4 }}>Mora: <strong style={{ color: T.green }}>$0 — protegido</strong></div>
                                    <div style={{ fontSize: 11, color: T.textSecondary, marginBottom: 4 }}>Venta adicional con crédito: <strong style={{ color: T.green }}>{fmt(ventaPerdida)}</strong></div>
                                    <div style={{ fontSize: 11, color: T.textSecondary, marginBottom: 8 }}>Conciliación: <strong style={{ color: T.green }}>Automatizada</strong></div>
                                    <div style={{ borderTop: `1px solid ${T.green}44`, paddingTop: 6 }}>
                                      <span style={{ fontSize: 13, fontWeight: 800, color: T.green }}>Inversión: {fmt(totalInv)}</span>
                                    </div>
                                  </div>
                                </div>

                                {costoSinM > totalInv && (
                                  <div style={{ padding: "10px 14px", background: T.greenLight, borderRadius: 6, display: "flex", justifyContent: "space-between", alignItems: "center", border: `2px solid ${T.green}` }}>
                                    <div>
                                      <div style={{ fontSize: 12, fontWeight: 800, color: T.green }}>Beneficio neto: {fmt(costoSinM - totalInv)} en 12 meses</div>
                                      <div style={{ fontSize: 10, color: T.textSecondary }}>Proteges tu cartera, vendes más a crédito y eliminas costos operativos</div>
                                    </div>
                                    <div style={{ fontSize: 20, fontWeight: 800, color: T.green }}>{Math.round(costoSinM / Math.max(totalInv, 1))}x</div>
                                  </div>
                                )}
                                </div>{/* close pdf-section */}
                              </div>
                            );
                          })()}

                          {/* Footer */}
                          <div style={{ borderTop: `1px solid ${T.border}`, paddingTop: 10, marginTop: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <div style={{ fontSize: 10, color: T.textMuted }}>Mango / Tecnologías Morales Angelini S.A.P.I. de C.V.</div>
                            <div style={{ fontSize: 10, color: T.textMuted }}>Resumen generado el {fechaHoy}</div>
                          </div>
                        </div>
                      </div>

                      {/* Sticky bottom action bar */}
                      <div style={{ padding: "14px 32px", background: T.surface, borderTop: `1px solid ${T.border}`, flexShrink: 0 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <button onClick={() => setPropuestaStep("form")}
                            style={{ padding: "10px 20px", background: T.bg, color: T.textSecondary, border: `1px solid ${T.border}`, borderRadius: T.radiusButton, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>
                            Volver
                          </button>
                          <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                            {/* Doc checkboxes */}
                            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                              <label style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontSize: 12, color: T.text, fontWeight: 500 }}>
                                <input type="checkbox" checked={pdfPropuesta} onChange={e => setPdfPropuesta(e.target.checked)} style={{ accentColor: T.primary, width: 15, height: 15 }} />
                                Propuesta
                              </label>
                              <label style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontSize: 12, color: T.text, fontWeight: 500 }}>
                                <input type="checkbox" checked={pdfBrochure} onChange={e => setPdfBrochure(e.target.checked)} style={{ accentColor: T.primary, width: 15, height: 15 }} />
                                Brochure
                              </label>
                            </div>
                            <button disabled={!pdfPropuesta && !pdfBrochure} onClick={() => {
                              const ids = [];
                              if (pdfPropuesta) ids.push("propuesta-pdf");
                              if (pdfBrochure) ids.push("brochure-pdf");
                              const name = pdfPropuesta && pdfBrochure
                                ? `Mango – ${propuestaData.empresa}.pdf`
                                : pdfPropuesta
                                  ? `Propuesta Comercial ${propuestaData.empresa}.pdf`
                                  : `Resumen Ejecutivo ${propuestaData.empresa}.pdf`;
                              downloadPDF(ids, name);
                            }}
                              style={{ padding: "10px 18px", background: (!pdfPropuesta && !pdfBrochure) ? T.border : T.bg, color: (!pdfPropuesta && !pdfBrochure) ? T.textMuted : T.dark, border: `1px solid ${T.border}`, borderRadius: T.radiusButton, fontSize: 12, fontWeight: 600, cursor: (!pdfPropuesta && !pdfBrochure) ? "not-allowed" : "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 6 }}>
                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                              Descargar PDF
                            </button>
                            <button onClick={handleGmail}
                              style={{ padding: "12px 24px", background: T.primary, color: T.dark, border: "none", borderRadius: T.radiusButton, fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", boxShadow: "0 2px 8px rgba(255,206,0,0.3)", display: "flex", alignItems: "center", gap: 8 }}>
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                              Enviar por Gmail
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* === STEP: SENT === */}
                  {propuestaStep === "sent" && (
                    <div style={{ padding: "48px 32px", textAlign: "center" }}>
                      <div style={{ width: 64, height: 64, borderRadius: 32, background: T.greenLight, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 20px", border: `2px solid ${T.green}` }}>
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={T.green} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                      </div>
                      <div style={{ fontSize: 22, fontWeight: 800, color: T.dark, marginBottom: 8 }}>Gmail abierto</div>
                      <div style={{ fontSize: 14, color: T.textSecondary, marginBottom: 6 }}>Se abrió Gmail con la propuesta para <strong>{propuestaData.email}</strong>.</div>
                      <div style={{ fontSize: 13, color: T.textMuted, marginBottom: 20 }}>No olvides adjuntar los PDFs descargados antes de enviar.</div>
                      <div style={{ display: "flex", gap: 10, justifyContent: "center", alignItems: "center", marginBottom: 28 }}>
                        <label style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontSize: 12, color: T.text, fontWeight: 500 }}>
                          <input type="checkbox" checked={pdfPropuesta} onChange={e => setPdfPropuesta(e.target.checked)} style={{ accentColor: T.primary, width: 15, height: 15 }} />
                          Propuesta
                        </label>
                        <label style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontSize: 12, color: T.text, fontWeight: 500 }}>
                          <input type="checkbox" checked={pdfBrochure} onChange={e => setPdfBrochure(e.target.checked)} style={{ accentColor: T.primary, width: 15, height: 15 }} />
                          Brochure
                        </label>
                        <button disabled={!pdfPropuesta && !pdfBrochure} onClick={() => {
                          const ids = [];
                          if (pdfPropuesta) ids.push("propuesta-pdf");
                          if (pdfBrochure) ids.push("brochure-pdf");
                          const name = pdfPropuesta && pdfBrochure
                            ? `Mango – ${propuestaData.empresa}.pdf`
                            : pdfPropuesta
                              ? `Propuesta Comercial ${propuestaData.empresa}.pdf`
                              : `Resumen Ejecutivo ${propuestaData.empresa}.pdf`;
                          downloadPDF(ids, name);
                        }}
                          style={{ padding: "10px 18px", background: (!pdfPropuesta && !pdfBrochure) ? T.border : T.bg, color: (!pdfPropuesta && !pdfBrochure) ? T.textMuted : T.dark, border: `1px solid ${T.border}`, borderRadius: T.radiusButton, fontSize: 12, fontWeight: 600, cursor: (!pdfPropuesta && !pdfBrochure) ? "not-allowed" : "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 6 }}>
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                          Descargar PDF
                        </button>
                      </div>
                      <button onClick={() => { setShowPropuesta(false); setPropuestaStep("form"); }}
                        style={{ padding: "12px 32px", background: T.primary, color: T.dark, border: "none", borderRadius: T.radiusButton, fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                        Cerrar
                      </button>
                    </div>
                  )}

                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PricingModel />);
  </script>
</body>
</html>
